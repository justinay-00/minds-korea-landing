<!DOCTYPE html>
<html lang="en">

  <title>Minds — Your AI partner for everyday life.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

    .glow-radial {

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white min-h-screen flex flex-col justify-between">

  <!-- Navigation -->
  <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-indigo-500/25">
          M
        </div>
        <span class="font-bold tracking-tight text-xl text-white">Minds</span>
      </div>
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-400">

        <a href="#scenarios" class="hover:text-white transition">Scenarios</a>
        <a href="#faq" class="hover:text-white transition">FAQ</a>
      </nav>
      <div class="flex items-center gap-3">
        <button onclick="openModal()" class="text-sm font-medium text-slate-300 hover:text-white px-3 py-1.5 transition">Log in</button>
        <button onclick="openModal()" class="text-sm font-semibold bg-white text-slate-950 hover:bg-slate-200 px-4 py-2 rounded-full transition shadow-sm">
          Get Started
        </button>
      </div>
    </div>
  </header>

  <main class="relative overflow-hidden">
    <!-- Radial Glow Header -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[550px] glow-radial pointer-events-none"></div>

    <!-- Hero Section -->
    <section class="max-w-5xl mx-auto px-6 pt-20 pb-16 text-center relative z-10">
      <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full border border-indigo-500/30 bg-indigo-950/40 text-indigo-300 text-xs font-semibold mb-8">
        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
        The AI that speaks to you first
      </div>
      
      <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white mb-6 leading-tight max-w-4xl mx-auto">
        Your AI partner for everyday life.<br class="hidden sm:inline" /> Minds is here to help.
      </h1>
      
      <p class="text-lg sm:text-xl text-slate-400 mb-10 max-w-2xl mx-auto leading-relaxed">
        Minds monitors your routines, handles tasks in the background, and reaches out when done.
      </p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <button onclick="openModal()" class="w-full sm:w-auto px-8 py-3.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-base transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">

          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
        <a href="#demo" class="w-full sm:w-auto px-7 py-3.5 rounded-full border border-slate-800 bg-slate-900/60 hover:bg-slate-800 text-slate-300 text-base font-medium transition text-center">
          Watch Preview
        </a>
      </div>
    </section>
